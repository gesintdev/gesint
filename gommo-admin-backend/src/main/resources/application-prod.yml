spring:
  config:
    # Local: le gommo-admin-backend/.env (simulacao Coolify). No container Coolify o arquivo nao existe — envs vem do painel.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

gommo-admin:
  security:
    jwt:
      secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${ADMIN_CORS_ORIGINS}
