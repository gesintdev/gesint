spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gommo}
    username: ${DB_USER:gommo}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

gommo-admin:
  tenant-db:
    fallback-password: ${TENANT_DB_FALLBACK_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:}}}
  security:
    jwt:
      # Obrigatório via JWT_SECRET no .env da raiz (mínimo 32 caracteres) — sem default
      secret: ${JWT_SECRET}
  cors:
    allowed-origins: http://localhost:3001
  systems:
    ctb:
      enabled: ${GOMMO_CTB_ENABLED:true}
