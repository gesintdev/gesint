spring:
  application:
    name: gommo-backend
  servlet:
    multipart:
      max-file-size: ${GOMMO_STORAGE_MAX_FILE_SIZE:25MB}
      max-request-size: ${GOMMO_STORAGE_MAX_REQUEST_SIZE:30MB}
  jackson:
    time-zone: America/Sao_Paulo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
      # Historico Envers: <tabela>_aud + revinfo, criados por migration (ver V121).
      org.hibernate.envers:
        audit_table_suffix: _aud
        revision_field_name: rev
        revision_type_field_name: revtype
        store_data_at_delete: false
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration
    # Historico e DDL do Client ficam no schema public (independente do admin).
    schemas: public
    default-schema: public
    create-schemas: false
    table: flyway_schema_history

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

gommo:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-minutes: 8
      refresh-token-rotation-minutes: 15
    # Chave para cifrar segredos em repouso (certificado A1/senha). Fallback: JWT_SECRET.
    secret-encryption-key: ${GOMMO_SECRET_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://*.localhost:3000,http://localhost:8090}
  multi-tenant:
    enabled: ${GOMMO_MULTI_TENANT_ENABLED:false}
    dev-tenant-slug: ${GOMMO_DEV_TENANT_SLUG:}
    dev-public-company-code: ${GOMMO_DEV_PUBLIC_COMPANY_CODE:}
    header-enabled: ${GOMMO_TENANT_HEADER_ENABLED:true}
    tenant-header: X-Tenant-Slug
    base-domain: ${GOMMO_TENANT_BASE_DOMAIN:localhost}
    production-base-domain: ${GOMMO_TENANT_PRODUCTION_BASE_DOMAIN:gommo.com.br}
  internal:
    event-secret: ${GOMMO_INTERNAL_EVENT_SECRET:}
  llm:
    provider: ${LLM_PROVIDER:gemini}
    model: ${LLM_MODEL:gemini-flash-lite-latest}
    api-key: ${LLM_API_KEY:}
    gemini-base-url: ${LLM_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    openai-base-url: ${LLM_OPENAI_BASE_URL:https://api.openai.com/v1}
    temperature: ${LLM_TEMPERATURE:0.3}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:1024}
    # Soft budget for the assistant usage footer (dev). Copy the TPM/daily figure from AI Studio.
    daily-token-limit: ${LLM_DAILY_TOKEN_LIMIT:0}
  # Bootstrap fino do sudo em public.app_user (PlatformAdminPublicBootstrap).
  platform-admin:
    username: admGommo
    full-name: Administrador Gesint
    email: gommo.admin@gmail.com
    password: ${GOMMO_PLATFORM_ADMIN_PASSWORD:${DEV_ADMIN_PASSWORD:}}
  systems:
    ctb:
      enabled: ${GOMMO_CTB_ENABLED:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{correlationId}] %msg%n"
