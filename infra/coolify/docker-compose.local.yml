# Simulacao local do deploy Coolify (apps separados + Postgres).
# Usa os .env de cada pasta (mesmo formato do servidor) e so sobrescreve hostnames da rede Docker.
#
# Na raiz do monorepo:
#   docker compose -f infra/coolify/docker-compose.local.yml --env-file .env up -d --build
#
# Build de um app sozinho (ex.: so Client backend):
#   docker compose -f infra/coolify/docker-compose.local.yml build gesint-backend
#   docker compose -f infra/coolify/docker-compose.local.yml up -d gesint-backend

name: gesint-local-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gesint}
      POSTGRES_USER: ${POSTGRES_USER:-gesint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesint_dev}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - gesint_local_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  gesint-backend:
    build:
      context: ../../gesint-backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - ../../gesint-backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Rede Docker (sobrescreve localhost do .env)
      DB_HOST: postgres
      STORAGE_LOCAL_PATH: /data/storage
    volumes:
      - gesint_local_storage:/data/storage
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1792M

  gesint-admin-backend:
    build:
      context: ../../gesint-admin-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../gesint-admin-backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      GESINT_HR_BASE_URL: http://gesint-backend:8081
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      gesint-backend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 640M

  gesint-frontend:
    build:
      context: ../../gesint-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    restart: unless-stopped
    env_file:
      - ../../gesint-frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - gesint-backend
    deploy:
      resources:
        limits:
          memory: 512M

  gesint-admin-frontend:
    build:
      context: ../../gesint-admin-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:8082}
        NEXT_PUBLIC_HR_API_URL: ${NEXT_PUBLIC_HR_API_URL:-http://localhost:8081}
    restart: unless-stopped
    env_file:
      - ../../gesint-admin-frontend/.env
    ports:
      - "3001:3001"
    depends_on:
      - gesint-admin-backend
      - gesint-backend
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  gesint_local_pg_data:
  gesint_local_storage:
