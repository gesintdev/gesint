# Stack Gommo para Coolify (Docker Compose unico — alternativa).
# Preferencial em VPS 8 GB: 4 Applications + 1 Database (ver infra/coolify/README.md).
# No Coolify Compose: Base Directory = raiz, Compose path = infra/coolify/docker-compose.yml

name: gommo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - gommo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  gommo-backend:
    build:
      context: ./gommo-backend
      dockerfile: Dockerfile
      # Stage de producao (ignora o target `dev` do Dockerfile)
      target: prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOMMO_INTERNAL_EVENT_SECRET: ${GOMMO_INTERNAL_EVENT_SECRET:-}
      SERVER_PORT: "8081"
      STORAGE_LOCAL_PATH: /data/storage
      STORAGE_BUCKET: ${STORAGE_BUCKET:-gommo-prod}
      # Evita OOM do JVM dentro do limite do container
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    volumes:
      - gommo_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Spring + Flyway em VPS pequena costuma passar de 2 min
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      start_interval: 10s
      retries: 10
    deploy:
      resources:
        limits:
          # Client leva a carga (folha/PDF/tenants). Admin fica mais enxuto.
          memory: 1792M

  gommo-admin-backend:
    build:
      context: ./gommo-admin-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS}
      # Rede Docker interna (nao use a URL publica do Coolify aqui)
      GOMMO_HR_BASE_URL: ${GOMMO_HR_BASE_URL:-http://gommo-backend:8081}
      GOMMO_INTERNAL_EVENT_SECRET: ${GOMMO_INTERNAL_EVENT_SECRET:-}
      ADMIN_SERVER_PORT: "8082"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      postgres:
        condition: service_healthy
      # service_started: nao aborta o deploy inteiro se o Client ainda estiver no Flyway
      gommo-backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      start_interval: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 640M

  gommo-frontend:
    build:
      context: ./gommo-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: ${HR_NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      gommo-backend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  gommo-admin-frontend:
    build:
      context: ./gommo-admin-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL}
        NEXT_PUBLIC_HR_API_URL: ${NEXT_PUBLIC_HR_API_URL}
    restart: unless-stopped
    environment:
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      AUTH_URL: ${ADMIN_AUTH_URL}
      NEXTAUTH_URL: ${ADMIN_NEXTAUTH_URL}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      gommo-admin-backend:
        condition: service_started
      gommo-backend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  gommo_pg_data:
  gommo_storage:
