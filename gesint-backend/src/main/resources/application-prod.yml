spring:
  config:
    # Local: le gesint-backend/.env (simulacao Coolify). No container Coolify o arquivo nao existe — envs vem do painel.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

gesint:
  security:
    jwt:
      secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  multi-tenant:
    # Producao: public e apenas template DDL — sem login de negocio.
    public-login-enabled: false
  # Nao espelha admGesint em public.app_user em producao.
  platform-admin:
    password: ""
  storage:
    local-base-path: ${STORAGE_LOCAL_PATH:/data/storage}
    bucket: ${STORAGE_BUCKET:gesint-prod}
