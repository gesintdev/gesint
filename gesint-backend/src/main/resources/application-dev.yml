spring:
  config:
    # Cobre cwd=gesint-backend (IDE/módulo) e cwd=raiz do monorepo (run na pasta pai).
    # Ordem: depois sobrescreve antes — gesint-backend/.env ganha quando a raiz tem chave vazia.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:gesint-backend/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gesint}
    username: ${DB_USER:gesint}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    # Banco local é compartilhado entre branches: tolera migrations aplicadas por outra branch e versões intercaladas.
    ignore-migration-patterns: ${FLYWAY_IGNORE_MIGRATION_PATTERNS:*:missing}
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}

gesint:
  multi-tenant:
    # DEV: schema public aceita login de negocio (admGesint). Em prod fica false.
    public-login-enabled: ${GESINT_PUBLIC_LOGIN_ENABLED:true}
    dev-tenant-slug: ${GESINT_DEV_TENANT_SLUG:dev-public}
    dev-public-company-code: ${GESINT_DEV_PUBLIC_COMPANY_CODE:000000000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://*.localhost:3000,http://localhost:3001,http://localhost:8090}
  storage:
    local-base-path: ${STORAGE_LOCAL_PATH:./data/storage}
    bucket: gesint-local
    max-file-size: ${GESINT_STORAGE_MAX_FILE_SIZE:25MB}
  payment:
    ocr:
      # Vazio = auto-detecta ./data/tessdata e ../data/tessdata (IDE na raiz vs mvn em gesint-backend)
      tessdata-path: ${TESSDATA_PREFIX:}
  systems:
    ctb:
      enabled: ${GESINT_CTB_ENABLED:true}
