spring:
  application:
    name: gesint-admin-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: America/Sao_Paulo
  datasource:
    hikari:
      # Enums de negocio ficam em gesint_types (movidos de public). Sem isso, CAST(? AS status_enum) quebra.
      connection-init-sql: SET search_path TO admin, public, gesint_types
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: admin
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Histórico e DDL da plataforma ficam no schema admin (versão V1, V2… independente do Client).
    schemas: admin
    default-schema: admin
    create-schemas: true
    table: flyway_schema_history

server:
  port: ${ADMIN_SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

gesint-admin:
  tenant-db:
    # Em dev, permite testar conexao sem vault (senha do tenant = DB_PASSWORD do compose).
    fallback-password: ${TENANT_DB_FALLBACK_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:}}}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-minutes: 15
      refresh-token-days: 7
    # Mesma chave do gesint-backend: o Client decifra a senha SMTP gravada aqui. Fallback: JWT_SECRET.
    secret-encryption-key: ${GESINT_SECRET_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${ADMIN_CORS_ORIGINS:http://localhost:3001}
  hr:
    base-url: ${GESINT_HR_BASE_URL:http://localhost:8081}
    internal-event-secret: ${GESINT_INTERNAL_EVENT_SECRET:}
  outbox:
    poll-interval-ms: ${GESINT_ADMIN_OUTBOX_POLL_MS:5000}
  # Bootstrap do sudo da plataforma (PlatformAdminBootstrap). Sem senha, nao cria usuario.
  platform-admin:
    username: admGesint
    full-name: Administrador Gesint
    email: flavio.henrique.dev@gmail.com
    password: ${GESINT_PLATFORM_ADMIN_PASSWORD:${DEV_ADMIN_PASSWORD:}}
  systems:
    ctb:
      enabled: ${GESINT_CTB_ENABLED:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{correlationId}] %msg%n"
