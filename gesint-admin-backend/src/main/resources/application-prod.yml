spring:
  config:
    # Local: le gesint-admin-backend/.env (simulacao Coolify). No container Coolify o arquivo nao existe — envs vem do painel.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

gesint-admin:
  # Producao: sem UI de ambiente de desenvolvimento e sem espelho em public.app_user.
  dev-environment:
    enabled: false
  security:
    jwt:
      secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${ADMIN_CORS_ORIGINS}
