spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gesint}
    username: ${DB_USER:gesint}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

gesint-admin:
  # UI + API de Ambiente de desenvolvimento (edicao do admGesint).
  dev-environment:
    enabled: ${GESINT_DEV_ENVIRONMENT_UI:true}
  tenant-db:
    fallback-password: ${TENANT_DB_FALLBACK_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:}}}
  security:
    jwt:
      # Obrigatório via JWT_SECRET no .env da raiz (mínimo 32 caracteres) — sem default
      secret: ${JWT_SECRET}
  cors:
    allowed-origins: http://localhost:3001
  systems:
    ctb:
      enabled: ${GESINT_CTB_ENABLED:true}
